<div class="portrait">
  <img class="ring" [src]="ringSrc()" alt="" width="224" height="224" loading="lazy">
  @if (member().photo; as photo) {
    <img class="face" [src]="photo" [alt]="'Portrait de ' + member().name" width="400" height="400" loading="lazy">
  } @else {
    <span class="face initials" aria-hidden="true">{{ initials() }}</span>
  }
</div>

<h3>{{ member().name }}</h3>
<p class="role">{{ member().role }}</p>
<p class="bio">{{ member().bio }}</p>
