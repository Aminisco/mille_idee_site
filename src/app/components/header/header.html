<div class="bar">
  <a class="brand" routerLink="/home" aria-label="Mille Idées, accueil">
    <img src="assets/logo/logo-mille-idees.png" alt="" width="84" height="55">
    <span class="brand-tagline">Asbl au service des jeunes de Bruxelles</span>
  </a>

  <nav class="nav" aria-label="Navigation principale">
    <a routerLink="/projets" routerLinkActive="is-active" ariaCurrentWhenActive="page">Projets</a>
    <a routerLink="/asbl" routerLinkActive="is-active" ariaCurrentWhenActive="page">L'asbl</a>
    <a routerLink="/contact" routerLinkActive="is-active" ariaCurrentWhenActive="page" class="btn btn--alt btn--small nav-contact">Contact</a>
  </nav>

  <button
    #menuButton
    class="menu-toggle"
    type="button"
    aria-controls="mobile-nav"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()">
    Menu
  </button>
</div>

<div class="drawer-backdrop" [class.open]="menuOpen()" (click)="closeMenu()" aria-hidden="true"></div>

<nav
  #drawer
  id="mobile-nav"
  class="drawer"
  [class.open]="menuOpen()"
  [attr.inert]="menuOpen() ? null : ''"
  aria-label="Menu">
  <button class="menu-toggle drawer-close" type="button" (click)="closeMenu(true)">Fermer</button>

  <a routerLink="/home" routerLinkActive="is-active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Accueil</a>
  <a routerLink="/projets" routerLinkActive="is-active" ariaCurrentWhenActive="page">Projets</a>
  <a routerLink="/asbl" routerLinkActive="is-active" ariaCurrentWhenActive="page">L'asbl</a>
  <a routerLink="/contact" routerLinkActive="is-active" ariaCurrentWhenActive="page">Contact</a>
</nav>
